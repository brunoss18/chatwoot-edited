# =============================================================================
# Chatwoot (fork Rede Focoh) — deploy no Coolify usando a IMAGEM JÁ PRONTA
# -----------------------------------------------------------------------------
# Use ESTE arquivo no Coolify (campo "Docker Compose Location"). Ele não builda
# nada: puxa a imagem publicada pelo GitHub Actions (.github/workflows/build-image.yml).
#
# Deploy passa de 15-25 min para ~2 min, e o servidor de produção deixa de
# competir por RAM com o build — que era o que estourava a memória no meio do
# `bundle install`.
#
# O irmão deste arquivo, `docker-compose.coolify.yaml`, builda no servidor.
# Fica como plano B caso o registry esteja fora do ar.
#
# POSTGRES E REDIS SÃO EXTERNOS (recursos separados do Coolify).
# SEGREDOS VÊM DAS ENVIRONMENT VARIABLES DO COOLIFY — ver COOLIFY_ENV.md.
# MIGRATIONS NÃO RODAM NO BOOT — ver DEPLOY_COOLIFY.md, passo 8.
#
# As FOCOH_SUPABASE_URL e FOCOH_SUPABASE_ANON_KEY são variáveis de runtime
# comuns: cadastre no Coolify e reinicie. Não são build args e não exigem
# rebuild da imagem.
# =============================================================================

x-chatwoot-base: &chatwoot-base
  # Se você fez fork para outra conta, troque o dono aqui.
  image: ghcr.io/brunoss18/chatwoot-focoh:latest
  environment:
    NODE_ENV: production
    RAILS_ENV: production
    INSTALLATION_ENV: docker
    # --- WhatsApp via Baileys -------------------------------------------------
    BAILEYS_PROVIDER_DEFAULT_URL: http://baileys-api:3025
    BAILEYS_PROVIDER_USE_INTERNAL_HOST_URL: "true"
    BAILEYS_PROVIDER_DEFAULT_API_KEY: ${BAILEYS_API_KEY:?defina BAILEYS_API_KEY}
    BAILEYS_PROVIDER_DEFAULT_CLIENT_NAME: ${BAILEYS_CLIENT_NAME:-Chatwoot Focoh}
    BAILEYS_WHATSAPP_GROUPS_ENABLED: ${BAILEYS_WHATSAPP_GROUPS_ENABLED:-false}
    WHATSAPP_GROUPS_ENABLED: ${WHATSAPP_GROUPS_ENABLED:-false}
  volumes:
    - storage_data:/app/storage
  restart: always

services:
  # Servidor web. O Traefik do Coolify alcança pela rede interna e emite o HTTPS
  # no domínio configurado para ESTE serviço.
  rails:
    <<: *chatwoot-base
    expose:
      - '3000'
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']

  # Jobs em background (e-mails, webhooks, automações).
  sidekiq:
    <<: *chatwoot-base
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

# WhatsApp por QR Code. A versão acompanha a do Chatwoot: 4.17.x pareia com a
  # v3.7.2 (a v3.2.0 é do 4.14.x). A sessão pareada vive no Redis, na chave
  # `@baileys-api:connections:<numero>:authState` — aqui o Redis é EXTERNO, então
  # a retenção do pareamento depende da persistência daquele recurso do Coolify.
  baileys-api:
    image: ghcr.io/fazer-ai/baileys-api:v3.7.2
    restart: always
    expose:
      - "3025"
    environment:
      # Obrigatório: fora de produção o logger importa `pino-caller`, ausente da
      # imagem, e o container entra em loop de restart.
      NODE_ENV: production
      BAILEYS_PROVIDER_DEFAULT_API_KEY: ${BAILEYS_API_KEY:?defina BAILEYS_API_KEY}
      BAILEYS_API_LOG_LEVEL: ${BAILEYS_API_LOG_LEVEL:-info}
      REDIS_URL: ${REDIS_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - bun manage-api-keys create user "$$BAILEYS_PROVIDER_DEFAULT_API_KEY" || true; exec bun start
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3025/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s


# Uploads e ActiveStorage, compartilhado porque os dois serviços leem e escrevem
# anexos.
volumes:
  storage_data:
