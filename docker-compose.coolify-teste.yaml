# =============================================================================
# Chatwoot (fork Rede Focoh) — instância de TESTE, auto-contida
# -----------------------------------------------------------------------------
# Postgres e Redis vivem DENTRO deste compose, como no template one-click do
# Coolify. Containers do mesmo compose se resolvem pelo nome do serviço, então
# `POSTGRES_HOST=postgres` e `redis://default@redis:6379` funcionam sem
# configurar rede alguma — que é onde o deploy com recursos separados travava
# (`pg_isready` em loop, porque o app nascia numa rede que não via os bancos).
#
# A imagem do app é a já pronta do GHCR, publicada pelo GitHub Actions.
#
# QUANDO USAR: para validar o fork e o módulo Kanban, e para desenvolvimento.
# Os outros dois arquivos servem a produção com bancos geridos pelo Coolify:
#   · docker-compose.coolify-image.yaml  — imagem pronta, bancos externos
#   · docker-compose.coolify.yaml        — builda no servidor, bancos externos
#
# ⚠️ Os bancos daqui NÃO têm backup gerido pelo Coolify (a aba Backups existe
# só para recursos de banco). Não use este arquivo para dado clínico real.
#
# SEGREDOS VÊM DAS ENVIRONMENT VARIABLES DO COOLIFY — ver COOLIFY_ENV.md.
# MIGRATIONS NÃO RODAM NO BOOT — ver DEPLOY_COOLIFY.md, passo 8.
# =============================================================================

x-chatwoot-base: &chatwoot-base
  image: ghcr.io/brunoss18/chatwoot-focoh:latest
  environment:
    NODE_ENV: production
    RAILS_ENV: production
    INSTALLATION_ENV: docker
    # --- Aplicação ------------------------------------------------------------
    # Declaradas explicitamente de propósito. O Coolify 4.0 injetava as variáveis
    # do painel dentro de cada serviço do compose; o 4.3 só faz substituição de
    # ${VAR} no arquivo. Sem estas linhas o container sobe com POSTGRES_HOST
    # vazio e o entrypoint fica em loop eterno de `pg_isready -h -p 5432`.
    # E sem `${VAR:?mensagem}`: o Coolify lê essa forma e cria a variável no
    # painel JÁ COM A MENSAGEM como valor. O container então sobe com
    # SECRET_KEY_BASE="defina SECRET_KEY_BASE" — uma proteção que, aqui, produz
    # exatamente o erro que ela existia para evitar.
    SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    FRONTEND_URL: ${FRONTEND_URL}
    RAILS_LOG_TO_STDOUT: ${RAILS_LOG_TO_STDOUT:-true}
    RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
    SIDEKIQ_CONCURRENCY: ${SIDEKIQ_CONCURRENCY:-10}
    DEFAULT_LOCALE: ${DEFAULT_LOCALE:-pt_BR}
    FORCE_SSL: ${FORCE_SSL:-false}
    ACTIVE_STORAGE_SERVICE: ${ACTIVE_STORAGE_SERVICE:-local}
    # --- Banco e fila ---------------------------------------------------------
    POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
    POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    POSTGRES_DATABASE: ${POSTGRES_DATABASE:-chatwoot_production}
    POSTGRES_USERNAME: ${POSTGRES_USERNAME:-chatwoot}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    REDIS_PASSWORD: ${REDIS_PASSWORD}
    # --- E-mail (pode ficar em branco; a aplicação sobe sem) -------------------
    MAILER_SENDER_EMAIL: ${MAILER_SENDER_EMAIL:-}
    SMTP_ADDRESS: ${SMTP_ADDRESS:-}
    SMTP_PORT: ${SMTP_PORT:-}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_DOMAIN: ${SMTP_DOMAIN:-}
    SMTP_AUTHENTICATION: ${SMTP_AUTHENTICATION:-}
    SMTP_ENABLE_STARTTLS_AUTO: ${SMTP_ENABLE_STARTTLS_AUTO:-}
    # --- Kanban Clínico (runtime, não build) ----------------------------------
    FOCOH_SUPABASE_URL: ${FOCOH_SUPABASE_URL:-}
    FOCOH_SUPABASE_ANON_KEY: ${FOCOH_SUPABASE_ANON_KEY:-}
    FOCOH_SUPABASE_JWT_SECRET: ${FOCOH_SUPABASE_JWT_SECRET:-}
    # --- WhatsApp via Baileys -------------------------------------------------
    # A URL é fixa e interna: `baileys-api` é o nome do serviço neste mesmo
    # compose, então o Docker resolve sozinho. A porta 3025 nunca é publicada.
    BAILEYS_PROVIDER_DEFAULT_URL: http://baileys-api:3025
    BAILEYS_PROVIDER_USE_INTERNAL_HOST_URL: "true"
    BAILEYS_PROVIDER_DEFAULT_API_KEY: ${BAILEYS_API_KEY}
    BAILEYS_PROVIDER_DEFAULT_CLIENT_NAME: ${BAILEYS_CLIENT_NAME:-Chatwoot Focoh}
    BAILEYS_WHATSAPP_GROUPS_ENABLED: ${BAILEYS_WHATSAPP_GROUPS_ENABLED:-false}
    WHATSAPP_GROUPS_ENABLED: ${WHATSAPP_GROUPS_ENABLED:-false}
  volumes:
    - storage_data:/app/storage
  depends_on:
    - postgres
    - redis
  restart: always

services:
  rails:
    <<: *chatwoot-base
    expose:
      - '3000'
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']

  sidekiq:
    <<: *chatwoot-base
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  # pgvector, não a imagem oficial: o db/schema.rb do Chatwoot declara
  # `enable_extension "vector"`, que não existe no postgres padrão. Com esta
  # imagem, o próprio db:chatwoot_prepare cria as extensões ao carregar o
  # schema — nada de CREATE EXTENSION na mão.
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    # Sem `ports`: o banco fica acessível apenas dentro do compose, nunca da
    # internet.
    environment:
      # Os nomes à esquerda são os que a imagem do Postgres usa para
      # inicializar; os da direita são os que o Chatwoot lê. Assim você cadastra
      # só um conjunto de variáveis no Coolify.
      POSTGRES_DB: ${POSTGRES_DATABASE:-chatwoot_production}
      POSTGRES_USER: ${POSTGRES_USERNAME:-chatwoot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: always
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - redis_data:/data

  # ---------------------------------------------------------------------------
  # baileys-api — o provedor de WhatsApp por QR Code
  # ---------------------------------------------------------------------------
  # A versão NÃO é livre: ela acompanha a versão do Chatwoot. Este fork é 4.17.x
  # e o par correspondente é a v3.7.2 (a v3.2.0 pareia com o Chatwoot 4.14.x).
  # Trocar uma sem a outra quebra o contrato de webhook entre os dois.
  #
  # A sessão pareada do WhatsApp mora no REDIS, na chave
  #   @baileys-api:connections:<numero>:authState
  # e não em disco. Duas consequências práticas:
  #   · perder o volume do Redis é perder o pareamento — QR de novo;
  #   · migrar de VPS preservando o pareamento é copiar essa chave, com o
  #     serviço antigo DERRUBADO antes. O WhatsApp admite uma conexão por
  #     sessão; dois serviços no ar com a mesma credencial a invalidam.
  baileys-api:
    image: ghcr.io/fazer-ai/baileys-api:v3.7.2
    restart: always
    # Sem `ports`: só o Rails e o Sidekiq falam com ele, pela rede do compose.
    expose:
      - "3025"
    environment:
      # Obrigatório. Fora de produção o logger do baileys-api importa
      # `pino-caller`, que não está no bundle da imagem: sem esta linha o
      # serviço entra em loop de restart com "Cannot find package pino-caller".
      NODE_ENV: production
      BAILEYS_PROVIDER_DEFAULT_API_KEY: ${BAILEYS_API_KEY}
      BAILEYS_API_LOG_LEVEL: ${BAILEYS_API_LOG_LEVEL:-info}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # O `|| true` é de propósito: no segundo boot a criação da chave falha
    # porque ela já existe, e com `&&` isso impediria o serviço de subir depois
    # de qualquer restart.
    command:
      - sh
      - -c
      - bun manage-api-keys create user "$$BAILEYS_PROVIDER_DEFAULT_API_KEY" || true; exec bun start
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3025/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      - redis

volumes:
  storage_data:
  postgres_data:
  redis_data:
