# =============================================================================
# Chatwoot (fork Rede Focoh) — instância de TESTE, auto-contida
# -----------------------------------------------------------------------------
# Postgres e Redis vivem DENTRO deste compose, como no template one-click do
# Coolify. Containers do mesmo compose se resolvem pelo nome do serviço, então
# `POSTGRES_HOST=postgres` e `redis://default@redis:6379` funcionam sem
# configurar rede alguma — que é onde o deploy com recursos separados travava
# (`pg_isready` em loop, porque o app nascia numa rede que não via os bancos).
#
# A imagem do app é a já pronta do GHCR, publicada pelo GitHub Actions.
#
# QUANDO USAR: para validar o fork e o módulo Kanban, e para desenvolvimento.
# Os outros dois arquivos servem a produção com bancos geridos pelo Coolify:
#   · docker-compose.coolify-image.yaml  — imagem pronta, bancos externos
#   · docker-compose.coolify.yaml        — builda no servidor, bancos externos
#
# ⚠️ Os bancos daqui NÃO têm backup gerido pelo Coolify (a aba Backups existe
# só para recursos de banco). Não use este arquivo para dado clínico real.
#
# SEGREDOS VÊM DAS ENVIRONMENT VARIABLES DO COOLIFY — ver COOLIFY_ENV.md.
# MIGRATIONS NÃO RODAM NO BOOT — ver DEPLOY_COOLIFY.md, passo 8.
# =============================================================================

x-chatwoot-base: &chatwoot-base
  image: ghcr.io/brunoss18/chatwoot-focoh:latest
  environment:
    NODE_ENV: production
    RAILS_ENV: production
    INSTALLATION_ENV: docker
  volumes:
    - storage_data:/app/storage
  depends_on:
    - postgres
    - redis
  restart: always

services:
  rails:
    <<: *chatwoot-base
    expose:
      - '3000'
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']

  sidekiq:
    <<: *chatwoot-base
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  # pgvector, não a imagem oficial: o db/schema.rb do Chatwoot declara
  # `enable_extension "vector"`, que não existe no postgres padrão. Com esta
  # imagem, o próprio db:chatwoot_prepare cria as extensões ao carregar o
  # schema — nada de CREATE EXTENSION na mão.
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    # Sem `ports`: o banco fica acessível apenas dentro do compose, nunca da
    # internet.
    environment:
      # Os nomes à esquerda são os que a imagem do Postgres usa para
      # inicializar; os da direita são os que o Chatwoot lê. Assim você cadastra
      # só um conjunto de variáveis no Coolify.
      POSTGRES_DB: ${POSTGRES_DATABASE:-chatwoot_production}
      POSTGRES_USER: ${POSTGRES_USERNAME:-chatwoot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: always
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - redis_data:/data

volumes:
  storage_data:
  postgres_data:
  redis_data:
